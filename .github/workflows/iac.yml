name: IaC Blueprint Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  blueprint:
    name: Blueprint-only infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run blueprint tests
        run: make verify-azure-blueprint

      - name: Static Bicep validation where tooling exists
        run: make validate-iac

      - name: Confirm no deployment command is invoked
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          tokens = ["az", "deployment", "group", "create"]
          pattern = re.compile(r"\b" + r"\s+".join(tokens) + r"\b")
          matches = []

          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              if pattern.search(text):
                  matches.append(str(path))

          if matches:
              print("Deployment command found in workflow files:")
              for match in matches:
                  print(f"- {match}")
              sys.exit(1)
          PY

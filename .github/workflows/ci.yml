name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Generate synthetic data with CI profile
        run: python -m grid_reliability.data_generation.pipeline --config configs/synthetic_data_ci.yaml

      - name: Ingest and validate synthetic data with CI profile
        run: python -m grid_reliability.ingestion.pipeline --config configs/ingestion_ci.yaml

      - name: Verify ingestion outputs
        run: |
          test -s data/interim/smart_meter_events.jsonl
          test -s data/interim/substation_events.jsonl
          test -s data/interim/weather_data.jsonl
          test -s data/interim/asset_inventory.jsonl
          test -s data/interim/maintenance_logs.jsonl
          test -s data/interim/outage_history.jsonl
          test -s reports/ingestion/local-ci/metrics.json
          test -s reports/ingestion/local-ci/ingestion_manifest.json
          test -s reports/ingestion/local-ci/data_quality_report.md

      - name: Run forecasting with CI profile
        run: python -m grid_reliability.forecasting.pipeline --config configs/forecasting_ci.yaml

      - name: Verify forecasting outputs
        run: |
          test -s outputs/forecasting/forecast-ci/load_forecast.csv
          test -s outputs/forecasting/forecast-ci/metrics.json
          test -s outputs/forecasting/forecast-ci/model_comparison.csv
          test -s outputs/forecasting/forecast-ci/forecast_manifest.json
          test -s outputs/models/forecasting/forecast-ci/model_metadata.json
          test -s reports/forecasting/forecast-ci/forecast_evaluation.md
          test -s reports/forecasting/forecast-ci/model_card.md
          test -s reports/forecasting/forecast-ci/executive_load_forecast_summary.md

      - name: Run asset health with CI profile
        run: python -m grid_reliability.asset_health.pipeline --config configs/asset_health_ci.yaml

      - name: Verify asset-health outputs
        run: |
          test -s outputs/asset_health/asset-health-ci/asset_health_scores.csv
          test -s outputs/asset_health/asset-health-ci/asset_health_components.csv
          test -s outputs/asset_health/asset-health-ci/asset_health_reasons.csv
          test -s outputs/asset_health/asset-health-ci/maintenance_priorities.csv
          test -s outputs/asset_health/asset-health-ci/fleet_summary.json
          test -s outputs/asset_health/asset-health-ci/metrics.json
          test -s outputs/asset_health/asset-health-ci/asset_health_manifest.json
          test -s reports/asset_health/asset-health-ci/asset_health_report.md
          test -s reports/asset_health/asset-health-ci/maintenance_priority_report.md
          test -s reports/asset_health/asset-health-ci/asset_health_methodology.md
          test -s reports/asset_health/asset-health-ci/executive_asset_health_summary.md

      - name: Run outage prediction with CI profile
        run: python -m grid_reliability.outage_prediction.pipeline --config configs/outage_prediction_ci.yaml

      - name: Verify outage-prediction outputs
        run: |
          test -s outputs/outage_prediction/outage-prediction-ci/outage_risk_predictions.csv
          test -s outputs/outage_prediction/outage-prediction-ci/metrics.json
          test -s outputs/outage_prediction/outage-prediction-ci/model_comparison.csv
          test -s outputs/outage_prediction/outage-prediction-ci/threshold_analysis.csv
          test -s outputs/outage_prediction/outage-prediction-ci/confusion_matrix.csv
          test -s outputs/outage_prediction/outage-prediction-ci/outage_prediction_manifest.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/model_metadata.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/feature_schema.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/preprocessing_metadata.json
          test -s reports/outage_prediction/outage-prediction-ci/outage_prediction_evaluation.md
          test -s reports/outage_prediction/outage-prediction-ci/outage_risk_report.md
          test -s reports/outage_prediction/outage-prediction-ci/model_card.md
          test -s reports/outage_prediction/outage-prediction-ci/executive_outage_risk_summary.md

      - name: Run reliability analytics with CI profile
        run: python -m grid_reliability.reliability.pipeline --config configs/reliability_ci.yaml

      - name: Verify reliability outputs
        run: |
          test -s outputs/reliability/reliability-ci/reliability_kpis.csv
          test -s outputs/reliability/reliability-ci/reliability_components.csv
          test -s outputs/reliability/reliability-ci/reliability_trends.csv
          test -s outputs/reliability/reliability-ci/reliability_benchmarks.csv
          test -s outputs/reliability/reliability-ci/reliability_reasons.csv
          test -s outputs/reliability/reliability-ci/outage_event_summary.csv
          test -s outputs/reliability/reliability-ci/system_summary.json
          test -s outputs/reliability/reliability-ci/metrics.json
          test -s outputs/reliability/reliability-ci/reliability_manifest.json
          test -s reports/reliability/reliability-ci/reliability_performance_report.md
          test -s reports/reliability/reliability-ci/reliability_trend_report.md
          test -s reports/reliability/reliability-ci/reliability_methodology.md
          test -s reports/reliability/reliability-ci/executive_reliability_summary.md

      - name: Run operational monitoring with CI profile
        run: python -m grid_reliability.monitoring.pipeline --config configs/monitoring_ci.yaml

      - name: Verify monitoring outputs
        run: |
          test -s outputs/monitoring/monitoring_summary.csv
          test -s outputs/monitoring/alerts.csv
          test -s outputs/monitoring/monitoring-ci/pipeline_health.csv
          test -s outputs/monitoring/monitoring-ci/data_freshness.csv
          test -s outputs/monitoring/monitoring-ci/data_volume.csv
          test -s outputs/monitoring/monitoring-ci/data_quality_trends.csv
          test -s outputs/monitoring/monitoring-ci/schema_drift.csv
          test -s outputs/monitoring/monitoring-ci/distribution_drift.csv
          test -s outputs/monitoring/monitoring-ci/model_health.csv
          test -s outputs/monitoring/monitoring-ci/analytical_health.csv
          test -s outputs/monitoring/monitoring-ci/alert_evaluations.csv
          test -s outputs/monitoring/monitoring-ci/metrics.json
          test -s outputs/monitoring/monitoring-ci/monitoring_manifest.json
          test -s reports/monitoring/monitoring-ci/operational_health_report.md
          test -s reports/monitoring/monitoring-ci/data_quality_monitoring_report.md
          test -s reports/monitoring/monitoring-ci/model_monitoring_report.md
          test -s reports/monitoring/monitoring-ci/alert_summary.md
          test -s reports/monitoring/monitoring-ci/executive_monitoring_summary.md

      - name: Run GenAI assistant with CI profile
        run: python -m grid_reliability.genai.pipeline --config configs/genai_assistant_ci.yaml

      - name: Verify GenAI assistant outputs
        run: |
          test -s outputs/genai/grid_operations_responses.jsonl
          test -s outputs/genai/assistant-ci/retrieval_results.jsonl
          test -s outputs/genai/assistant-ci/citations.json
          test -s outputs/genai/assistant-ci/prompt_audit.jsonl
          test -s outputs/genai/assistant-ci/safety_evaluations.jsonl
          test -s outputs/genai/assistant-ci/evaluation_results.csv
          test -s outputs/genai/assistant-ci/metrics.json
          test -s outputs/genai/assistant-ci/assistant_manifest.json
          test -s reports/genai/assistant-ci/assistant_operations_report.md
          test -s reports/genai/assistant-ci/grounding_and_citation_report.md
          test -s reports/genai/assistant-ci/safety_report.md
          test -s reports/genai/assistant-ci/assistant_methodology.md
          test -s reports/genai/assistant-ci/executive_assistant_summary.md
          test -s reports/genai/assistant-ci/assistant_evaluation.md

      - name: Build reporting semantic outputs with CI profile
        run: python -m grid_reliability.reporting.pipeline --config configs/reporting_ci.yaml

      - name: Verify reporting semantic outputs
        run: |
          test -s outputs/reporting/reporting-ci/dim_date.csv
          test -s outputs/reporting/reporting-ci/dim_time.csv
          test -s outputs/reporting/reporting-ci/dim_grid_region.csv
          test -s outputs/reporting/reporting-ci/dim_substation.csv
          test -s outputs/reporting/reporting-ci/dim_feeder.csv
          test -s outputs/reporting/reporting-ci/dim_asset.csv
          test -s outputs/reporting/reporting-ci/dim_model.csv
          test -s outputs/reporting/reporting-ci/dim_component_run.csv
          test -s outputs/reporting/reporting-ci/dim_alert_reason.csv
          test -s outputs/reporting/reporting-ci/dim_metric.csv
          test -s outputs/reporting/reporting-ci/fact_demand_forecast.csv
          test -s outputs/reporting/reporting-ci/fact_asset_health.csv
          test -s outputs/reporting/reporting-ci/fact_outage_risk.csv
          test -s outputs/reporting/reporting-ci/fact_reliability_kpi.csv
          test -s outputs/reporting/reporting-ci/fact_monitoring_check.csv
          test -s outputs/reporting/reporting-ci/fact_monitoring_alert.csv
          test -s outputs/reporting/reporting-ci/fact_assistant_response.csv
          test -s outputs/reporting/reporting-ci/fact_maintenance_priority.csv
          test -s outputs/reporting/reporting-ci/bridge_asset_reason.csv
          test -s outputs/reporting/reporting-ci/bridge_entity_reason.csv
          test -s outputs/reporting/reporting-ci/bridge_response_citation.csv
          test -s outputs/reporting/reporting-ci/relationships.json
          test -s outputs/reporting/reporting-ci/kpi_catalogue.csv
          test -s outputs/reporting/reporting-ci/metrics.json
          test -s outputs/reporting/reporting-ci/reporting_manifest.json
          test -s dashboard/dax/measures.dax
          test -s dashboard/dax/measure-catalogue.md
          test -s dashboard/visual-specifications.md
          test -s dashboard/page-specifications/01_executive_overview.md
          test -s dashboard/wireframes/01_executive_overview.md
          test -s reports/reporting/reporting-ci/executive_grid_reliability_brief.md
          test -s reports/reporting/reporting-ci/grid_operations_dashboard_summary.md
          test -s reports/reporting/reporting-ci/asset_management_summary.md
          test -s reports/reporting/reporting-ci/reliability_performance_summary.md
          test -s reports/reporting/reporting-ci/data_and_model_governance_summary.md
          test -s reports/reporting/reporting-ci/reporting_model_validation.md

      - name: Pytest with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Confirm runtime outputs remain untracked
        run: |
          git status --short --ignored data outputs reports | grep -E '!! data/raw|!! data/interim|!! outputs/forecasting|!! outputs/asset_health|!! outputs/outage_prediction|!! outputs/reliability|!! outputs/monitoring|!! outputs/genai|!! outputs/reporting|!! reports/ingestion|!! reports/forecasting|!! reports/asset_health|!! reports/outage_prediction|!! reports/reliability|!! reports/monitoring|!! reports/genai|!! reports/reporting'

      - name: Clean generated runtime outputs
        run: |
          make clean-data
          make clean-interim
          make clean-quarantine
          make clean-ingestion-reports
          make clean-forecasting
          make clean-model-artifacts
          make clean-forecast-reports
          make clean-asset-health
          make clean-asset-health-reports
          make clean-outage-prediction
          make clean-outage-models
          make clean-outage-reports
          make clean-reliability
          make clean-reliability-reports
          make clean-monitoring
          make clean-monitoring-reports
          make clean-assistant
          make clean-assistant-reports
          make clean-reporting
          make clean-reporting-reports

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Generate synthetic data with CI profile
        run: python -m grid_reliability.data_generation.pipeline --config configs/synthetic_data_ci.yaml

      - name: Ingest and validate synthetic data with CI profile
        run: python -m grid_reliability.ingestion.pipeline --config configs/ingestion_ci.yaml

      - name: Verify ingestion outputs
        run: |
          test -s data/interim/smart_meter_events.jsonl
          test -s data/interim/substation_events.jsonl
          test -s data/interim/weather_data.jsonl
          test -s data/interim/asset_inventory.jsonl
          test -s data/interim/maintenance_logs.jsonl
          test -s data/interim/outage_history.jsonl
          test -s reports/ingestion/local-ci/metrics.json
          test -s reports/ingestion/local-ci/ingestion_manifest.json
          test -s reports/ingestion/local-ci/data_quality_report.md

      - name: Run forecasting with CI profile
        run: python -m grid_reliability.forecasting.pipeline --config configs/forecasting_ci.yaml

      - name: Verify forecasting outputs
        run: |
          test -s outputs/forecasting/forecast-ci/load_forecast.csv
          test -s outputs/forecasting/forecast-ci/metrics.json
          test -s outputs/forecasting/forecast-ci/model_comparison.csv
          test -s outputs/forecasting/forecast-ci/forecast_manifest.json
          test -s outputs/models/forecasting/forecast-ci/model_metadata.json
          test -s reports/forecasting/forecast-ci/forecast_evaluation.md
          test -s reports/forecasting/forecast-ci/model_card.md
          test -s reports/forecasting/forecast-ci/executive_load_forecast_summary.md

      - name: Run asset health with CI profile
        run: python -m grid_reliability.asset_health.pipeline --config configs/asset_health_ci.yaml

      - name: Verify asset-health outputs
        run: |
          test -s outputs/asset_health/asset-health-ci/asset_health_scores.csv
          test -s outputs/asset_health/asset-health-ci/asset_health_components.csv
          test -s outputs/asset_health/asset-health-ci/asset_health_reasons.csv
          test -s outputs/asset_health/asset-health-ci/maintenance_priorities.csv
          test -s outputs/asset_health/asset-health-ci/fleet_summary.json
          test -s outputs/asset_health/asset-health-ci/metrics.json
          test -s outputs/asset_health/asset-health-ci/asset_health_manifest.json
          test -s reports/asset_health/asset-health-ci/asset_health_report.md
          test -s reports/asset_health/asset-health-ci/maintenance_priority_report.md
          test -s reports/asset_health/asset-health-ci/asset_health_methodology.md
          test -s reports/asset_health/asset-health-ci/executive_asset_health_summary.md

      - name: Run outage prediction with CI profile
        run: python -m grid_reliability.outage_prediction.pipeline --config configs/outage_prediction_ci.yaml

      - name: Verify outage-prediction outputs
        run: |
          test -s outputs/outage_prediction/outage-prediction-ci/outage_risk_predictions.csv
          test -s outputs/outage_prediction/outage-prediction-ci/metrics.json
          test -s outputs/outage_prediction/outage-prediction-ci/model_comparison.csv
          test -s outputs/outage_prediction/outage-prediction-ci/threshold_analysis.csv
          test -s outputs/outage_prediction/outage-prediction-ci/confusion_matrix.csv
          test -s outputs/outage_prediction/outage-prediction-ci/outage_prediction_manifest.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/model_metadata.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/feature_schema.json
          test -s outputs/models/outage_prediction/outage-prediction-ci/preprocessing_metadata.json
          test -s reports/outage_prediction/outage-prediction-ci/outage_prediction_evaluation.md
          test -s reports/outage_prediction/outage-prediction-ci/outage_risk_report.md
          test -s reports/outage_prediction/outage-prediction-ci/model_card.md
          test -s reports/outage_prediction/outage-prediction-ci/executive_outage_risk_summary.md

      - name: Pytest with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Confirm runtime outputs remain untracked
        run: |
          git status --short --ignored data outputs reports | grep -E '!! data/raw|!! data/interim|!! outputs/forecasting|!! outputs/asset_health|!! outputs/outage_prediction|!! reports/ingestion|!! reports/forecasting|!! reports/asset_health|!! reports/outage_prediction'

      - name: Clean generated runtime outputs
        run: |
          make clean-data
          make clean-interim
          make clean-quarantine
          make clean-ingestion-reports
          make clean-forecasting
          make clean-model-artifacts
          make clean-forecast-reports
          make clean-asset-health
          make clean-asset-health-reports
          make clean-outage-prediction
          make clean-outage-models
          make clean-outage-reports
